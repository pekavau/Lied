name: lied

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lied}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lied}
      POSTGRES_DB: ${POSTGRES_DB:-lied}
    ports:
      - "5432:5432"
    volumes:
      # Host-mounted per the phase-1 backup posture (docs/design.md): `just backup`
      # and disaster recovery operate directly on these directories.
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lied}"]
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    # Object storage: RustFS (Apache-2.0, S3-compatible), pinned. The test
    # harnesses pin the same tag (lied/tests/common); bump both together.
    # Chosen in #59, see docs/design.md (Tech stack).
    image: rustfs/rustfs:1.0.5
    # The image runs as uid 10001, which cannot write the host-mounted
    # ./.data/storage that Docker creates root-owned on first start.
    user: "0:0"
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # Host-mounted per the phase-1 backup posture (docs/design.md).
      - ./.data/storage:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      LIED_BIND_ADDR: "0.0.0.0:8080"
      LIED_DATABASE_URL: postgres://${POSTGRES_USER:-lied}:${POSTGRES_PASSWORD:-lied}@postgres:5432/${POSTGRES_DB:-lied}
      LIED_S3_ENDPOINT: http://storage:9000
      LIED_S3_BUCKET: ${LIED_S3_BUCKET:-lied}
      LIED_S3_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      LIED_S3_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      LIED_JWT_SIGNING_KEY: ${LIED_JWT_SIGNING_KEY:-dev-only-insecure-signing-key-do-not-use-in-prod}
      LIED_TRACING_PRETTY: "true"
      LIED_METRICS_ENABLED: "${LIED_METRICS_ENABLED:-false}"
      LIED_DOCS_ENABLED: "${LIED_DOCS_ENABLED:-true}"
      LIED_S3_VERSION_RETENTION_DAYS: "${LIED_S3_VERSION_RETENTION_DAYS:-30}"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - cargo-target:/app/target
      - cargo-registry:/usr/local/cargo/registry

volumes:
  # Postgres data, object-storage data, and the backup target dir (./backup, used by
  # `just backup`) are intentionally host-mounted bind paths above, not
  # named volumes, per the phase-1 backup posture in docs/design.md — required
  # so `pg_dump`/`rclone` and disaster-recovery tooling can reach them
  # directly from the host. Only the cargo build caches below are named
  # volumes, since they hold no data that needs backing up.
  cargo-target:
  cargo-registry:
